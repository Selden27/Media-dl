# Cloudflare WARP as a SOCKS5/HTTP proxy on port 1080 (not published on the host).
services:
  warp:
    image: caomingjun/warp:2026.8.2115.0-2.12.0
    restart: always
    device_cgroup_rules:
      - 'c 10:200 rwm'
    environment:
      - WARP_SLEEP=2
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp-data:/var/lib/cloudflare-warp
volumes:
  warp-data:
