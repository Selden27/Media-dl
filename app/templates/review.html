<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>À valider · Media DL</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#16181d;--muted:#667085;--line:#e4e7ec;--accent:#4f46e5;--ok:#12805c;--err:#c0362c;--warn:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--text:#e8eaf0;--muted:#98a2b3;--line:#2a2f3a;--accent:#818cf8;--ok:#34d399;--err:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px 48px}
a{color:var(--accent)}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.title{font-weight:600;word-break:break-word}
.m{color:var(--muted);font-size:13px;word-break:break-word}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 12px;margin-top:8px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;font:inherit}
.covers{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.cov{border:2px solid transparent;border-radius:8px;padding:3px;cursor:pointer;text-align:center;font-size:11px;color:var(--muted);width:104px}
.cov img{width:96px;height:96px;object-fit:cover;border-radius:5px;display:block;background:var(--line)}
.cov.sel{border-color:var(--accent)}
.cov.none div{width:96px;height:96px;border-radius:5px;background:var(--line);display:flex;align-items:center;justify-content:center}
.path{margin-top:12px;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:13px;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.check{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--text);margin:0}
.check input{width:auto}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:400}
button:disabled{opacity:.6}
.badge{font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.sugg{border-left:3px solid var(--warn);background:var(--bg);padding:8px 10px;border-radius:6px;margin-top:10px;font-size:14px}
.sugg select{width:auto;padding:5px 8px}
.sugg button{padding:5px 10px;font-size:13px}
.err{color:var(--err);font-size:13px;margin-top:6px}
.ok{color:var(--ok)}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
  <p class="m"><a href="./">← Media DL</a></p>
  <h1>À valider</h1>
  <p class="sub">Morceaux rangés dans « _A trier » parce que l'identification n'était pas assez sûre. Corrige les tags puis valide : le fichier est mis à jour et rangé à sa place dans pCloud.</p>

  <div id="suggestions"></div>
  <div id="items"><p class="empty">Chargement…</p></div>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FIELDS = [['title','Titre'],['artist','Artiste'],['albumartist',"Artiste de l'album"],['album','Album'],
                ['track','N° de piste'],['total_tracks','Nb de pistes'],['disc','Disque'],['year','Année'],['label','Label']];
let genres = [];

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function genreOptions(selected) {
  return '<option value="">— aucun —</option>' + genres.map(g => `<option ${g === selected ? 'selected' : ''}>${esc(g)}</option>`).join('');
}

function suggestionBox(name, info) {
  const why = info && info.consensus ? 'plusieurs sources sont d’accord sur' : `vu ${info ? info.count : ''} fois :`;
  return `<div class="sugg" data-name="${esc(name)}">
    Genre absent de ta liste — ${why} <b>${esc(name)}</b>
    <div class="row" style="margin-top:6px">
      <button data-act="add">Ajouter à ma liste</button>
      <span>ou associer à</span><select data-target>${genres.map(g => `<option>${esc(g)}</option>`).join('')}</select>
      <button data-act="map" class="ghost">Associer</button>
      <button data-act="ignore" class="ghost">Ignorer</button>
    </div></div>`;
}

function renderSuggestions(list) {
  const box = $('#suggestions');
  box.innerHTML = list.length ? '<h2>Genres suggérés</h2>' + list.map(s => suggestionBox(s.name, s)).join('') : '';
}

function itemCard(it) {
  const t = it.tags, conf = Math.round((t.confidence || 0) * 100);
  const cands = it.candidates.map((c, i) => `<option value="${i}">${esc(c.source)} · ${esc(c.title)} — ${esc(c.artist)}${c.album ? ' (' + esc(c.album) + ')' : ''} · ${Math.round(c.confidence * 100)} %</option>`).join('');
  const covers = it.covers.map(c => `<div class="cov ${c.name === it.cover ? 'sel' : ''}" data-cover="${esc(c.name)}"><img src="api/review/${it.id}/cover/${esc(c.name)}" alt=""><span>${esc(c.label)}</span></div>`).join('')
    + `<div class="cov none ${!it.cover ? 'sel' : ''}" data-cover=""><div>∅</div><span>Sans pochette</span></div>`;
  const consensus = (t.genre_consensus || []);
  return `<div class="card" data-id="${it.id}">
    <div class="head"><div class="title">${esc(it.hints.title || t.title)}</div>
      <span class="badge">confiance ${conf} % · ${esc(t.source || '?')}</span></div>
    <div class="m">Actuellement : ${esc(it.path)}${it.hints.url ? ` · <a href="${esc(it.hints.url)}" target="_blank" rel="noopener">source</a>` : ''}</div>
    ${cands ? `<label>Autre résultat trouvé</label><div class="row" style="margin-top:0"><select data-cand style="flex:1"><option value="">— garder les tags actuels —</option>${cands}</select></div>` : ''}
    <div class="grid">${FIELDS.map(([k, l]) => `<div><label>${l}</label><input data-f="${k}" value="${esc(t[k] ?? '')}"></div>`).join('')}
      <div><label>Genre</label><select data-f="genre">${genreOptions(t.genre)}</select></div></div>
    ${consensus.map(n => suggestionBox(n, {consensus: true})).join('')}
    <label>Pochette</label><div class="covers">${covers}</div>
    <div class="path">→ <span data-preview>${esc(it.preview)}</span></div>
    <div class="row">
      <label class="check"><input type="checkbox" data-remember checked> Retenir le genre pour cet artiste</label>
    </div>
    <div class="row"><button data-validate>Valider et ranger</button>
      <button class="ghost" data-dismiss title="Le fichier reste dans _A trier">Retirer de la liste</button></div>
    <div class="err" data-err></div>
  </div>`;
}

function readTags(card) {
  const tags = {};
  card.querySelectorAll('[data-f]').forEach(el => tags[el.dataset.f] = el.value);
  return tags;
}

let previewTimer;
function schedulePreview(card) {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    try { $('[data-preview]', card).textContent = (await api(`api/review/${card.dataset.id}/preview`, readTags(card))).path; } catch (e) {}
  }, 300);
}

async function load() {
  const data = await api('api/review');
  genres = data.genres;
  renderSuggestions(data.suggestions);
  $('#items').innerHTML = data.items.length ? data.items.map(itemCard).join('') : '<p class="empty">Rien à valider pour l’instant. 🎉</p>';
}

document.addEventListener('input', e => { const card = e.target.closest('.card[data-id]'); if (card && e.target.dataset.f) schedulePreview(card); });
document.addEventListener('change', async e => {
  const card = e.target.closest('.card[data-id]');
  if (card && e.target.matches('[data-f="genre"]')) schedulePreview(card);
  if (card && e.target.matches('[data-cand]') && e.target.value !== '') {
    const err = $('[data-err]', card); err.textContent = 'Chargement du résultat…';
    try {
      const item = await api(`api/review/${card.dataset.id}/candidate`, {index: +e.target.value});
      const keepGenre = $('[data-f="genre"]', card).value;
      const fresh = document.createElement('div'); fresh.innerHTML = itemCard(item);
      const newCard = fresh.firstElementChild; card.replaceWith(newCard);
      if (keepGenre) $('[data-f="genre"]', newCard).value = keepGenre;
      $('[data-cand]', newCard).value = e.target.value;
    } catch (x) { err.textContent = x.message; }
  }
});
document.addEventListener('click', async e => {
  const cov = e.target.closest('.cov');
  if (cov) { cov.parentElement.querySelectorAll('.cov').forEach(c => c.classList.remove('sel')); cov.classList.add('sel'); return; }
  const sugg = e.target.closest('.sugg');
  if (sugg && e.target.dataset.act) {
    const act = e.target.dataset.act, name = sugg.dataset.name;
    let body = {name, action: act};
    if (act === 'add') { const label = prompt('Nom du genre à ajouter :', name.replace(/\b\w/g, c => c.toUpperCase())); if (!label) return; body.label = label; }
    if (act === 'map') body.target = $('[data-target]', sugg).value;
    try {
      const r = await api('api/genres/suggestion', body);
      const ownCard = sugg.closest('.card[data-id]');  // before the banner is removed
      genres = r.genres;
      document.querySelectorAll(`.sugg[data-name="${CSS.escape(name)}"]`).forEach(s => s.remove());
      document.querySelectorAll('[data-f="genre"]').forEach(sel => { const v = sel.value; sel.innerHTML = genreOptions(v); });
      // In the track's own card: a newly added genre is selected; a mapping fills an empty genre.
      const sel = ownCard && $('[data-f="genre"]', ownCard);
      if (sel && act === 'add') sel.value = r.genre;
      if (sel && act === 'map' && !sel.value) sel.value = body.target;
      if (ownCard) schedulePreview(ownCard);
      const box = $('#suggestions'); if (box.querySelectorAll('.sugg').length === 0) box.innerHTML = '';
    } catch (x) { alert(x.message); }
    return;
  }
  const card = e.target.closest('.card[data-id]');
  if (!card) return;
  const err = $('[data-err]', card);
  if (e.target.matches('[data-validate]')) {
    e.target.disabled = true; err.textContent = 'Mise à jour du fichier et rangement…';
    try {
      const sel = $('.cov.sel', card);
      const r = await api(`api/review/${card.dataset.id}/validate`, {tags: readTags(card), cover: sel ? sel.dataset.cover : '',
                          remember: $('[data-remember]', card).checked});
      card.innerHTML = `<div class="ok">✓ Rangé dans ${esc(r.path)}</div>`;
      setTimeout(() => card.remove(), 4000);
    } catch (x) { err.textContent = x.message; e.target.disabled = false; }
  }
  if (e.target.matches('[data-dismiss]')) {
    if (!confirm('Retirer de la liste ? Le fichier reste dans « _A trier ».')) return;
    await api(`api/review/${card.dataset.id}/dismiss`, {}); card.remove();
  }
});
load().catch(e => $('#items').innerHTML = `<p class="err">${esc(e.message)}</p>`);
</script>
</body>
</html>
